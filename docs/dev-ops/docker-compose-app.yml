services:
  walissh-server-app:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: walissh-server-app
    restart: on-failure
    ports:
      - "8091:8090"
    environment:
      TZ: Asia/Shanghai
      WALISSH_DATABASE_URL: ${WALISSH_DATABASE_URL:?set WALISSH_DATABASE_URL}
      WALISSH_SECRET_KEY: ${WALISSH_SECRET_KEY:?set WALISSH_SECRET_KEY}
      WALISSH_AGENT_MODEL: ${WALISSH_AGENT_MODEL:-claude-sonnet-4-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY}
    networks: [my-network]

networks:
  my-network:
    driver: bridge
