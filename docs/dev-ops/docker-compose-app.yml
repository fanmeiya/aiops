services:
  walissh-server-app:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: walissh-server-app
    restart: on-failure
    ports:
      - "8091:8090"
    environment:
      TZ: Asia/Shanghai
      WALISSH_DATABASE_URL: ${WALISSH_DATABASE_URL:?set WALISSH_DATABASE_URL}
      WALISSH_SECRET_KEY: ${WALISSH_SECRET_KEY:?set WALISSH_SECRET_KEY}
      WALISSH_DEEPSEEK_API_KEY: ${WALISSH_DEEPSEEK_API_KEY:?set WALISSH_DEEPSEEK_API_KEY}
      WALISSH_DEEPSEEK_BASE_URL: ${WALISSH_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      WALISSH_DEEPSEEK_MODEL: ${WALISSH_DEEPSEEK_MODEL:-deepseek-chat}
      WALISSH_EMBEDDING_API_KEY: ${WALISSH_EMBEDDING_API_KEY:-}
      WALISSH_EMBEDDING_BASE_URL: ${WALISSH_EMBEDDING_BASE_URL:-}
      WALISSH_EMBEDDING_MODEL: ${WALISSH_EMBEDDING_MODEL:-}
      WALISSH_KNOWLEDGE_TOP_K: ${WALISSH_KNOWLEDGE_TOP_K:-6}
    networks: [my-network]

networks:
  my-network:
    driver: bridge
