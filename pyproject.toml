[project]
name = "walissh-python"
version = "1.0.0"
description = "Python-native FastAPI and LangGraph SSH operations agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "aiomysql>=0.2,<1",
  "asyncssh>=2.18,<3",
  "cryptography>=43,<47",
  "python-multipart>=0.0.12,<1",
  "langgraph>=0.3,<1",
  "openai>=1.68,<2",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-asyncio>=0.24,<1", "aiosqlite>=0.20,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
